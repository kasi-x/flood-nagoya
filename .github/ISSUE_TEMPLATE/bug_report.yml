name: Bug report
description: Report an error or unexpected behavior
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! Before reporting,
        please search through existing issues (including closed ones) to avoid duplicates.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug, including a minimal reproducible example.
      placeholder: Describe the bug and how to reproduce it
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any error messages or tracebacks.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: |
        Python version, operating system, and package versions.
        Include the output of `python -m {{ package_name }} --version` if applicable.
      placeholder: e.g. Python 3.12, Ubuntu 24.04, package 0.1.0
    validations:
      required: false
