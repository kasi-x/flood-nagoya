[project]
site_url = "https://kasi-x.github.io/flood-nagoya"
site_name = "flood-nagoya"
site_description = "名古屋市の標高データ(国土地理院5mDEM)とPLATEAU建物データを用いたGPU浅水方程式ベースの雨水流出エミュレーター"
site_author = "kasi-x"

repo_url = "https://github.com/kasi-x/flood-nagoya"
repo_name = "kasi-x/flood-nagoya"
edit_uri = "edit/main/docs/"

copyright = 'Maintained by <a href="https://github.com/kasi-x/flood-nagoya">kasi-x</a>.'

nav = [
  { "Home" = "index.md" },
  { "Installation" = "tutorials/installation.md" },
  { "3Dビュワー比較" = "viewers.md" },
  { "Modules" = "modules.md" },
]

[project.theme]
name = "material"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins]
mkdocstrings = { default_handler = "python", handlers = { python = { paths = ["src"] } } }
search = {}

[project.markdown_extensions]
admonition = {}
toc = { permalink = true }
pymdownx.superfences = {}
